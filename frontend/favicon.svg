<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Base Container -->
  <rect width="32" height="32" rx="7" fill="#0b0f19" stroke="#1e293b" stroke-width="1.2"/>
  
  <!-- Graph Edges -->
  <line x1="8" y1="16" x2="16" y2="7" stroke="url(#brandGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <line x1="16" y1="7" x2="24" y2="16" stroke="url(#brandGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <line x1="8" y1="16" x2="16" y2="25" stroke="url(#brandGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <line x1="16" y1="25" x2="24" y2="16" stroke="url(#brandGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <line x1="8" y1="16" x2="24" y2="16" stroke="#334155" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- Graph Nodes -->
  <circle cx="16" cy="7" r="3.2" fill="url(#nodeGrad)" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="8" cy="16" r="3" fill="#3b82f6" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="24" cy="16" r="3" fill="#06b6d4" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="16" cy="25" r="3.2" fill="#8b5cf6" stroke="#0f172a" stroke-width="1.2"/>
  
  <!-- Center Core Node -->
  <circle cx="16" cy="16" r="2" fill="#f8fafc" />
</svg>
