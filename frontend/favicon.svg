<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#0C1422"/>
  <!-- Graph Connecting Edges -->
  <line x1="16" y1="16" x2="16" y2="6" stroke="#4F8CFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="26" y2="16" stroke="#4F8CFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="16" y2="26" stroke="#4F8CFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="6" y2="16" stroke="#4F8CFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="23.5" y2="8.5" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 2"/>
  <line x1="16" y1="16" x2="8.5" y2="23.5" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 2"/>
  <line x1="23.5" y1="8.5" x2="26" y2="16" stroke="#4F8CFF" stroke-width="1.4" stroke-opacity="0.6"/>
  <line x1="6" y1="16" x2="8.5" y2="23.5" stroke="#4F8CFF" stroke-width="1.4" stroke-opacity="0.6"/>

  <!-- Satellite Nodes -->
  <circle cx="16" cy="6" r="2.8" fill="#4F8CFF"/>
  <circle cx="26" cy="16" r="2.8" fill="#4F8CFF"/>
  <circle cx="16" cy="26" r="2.8" fill="#4F8CFF"/>
  <circle cx="6" cy="16" r="2.8" fill="#4F8CFF"/>

  <!-- Violet Intelligence Accent Nodes -->
  <circle cx="23.5" cy="8.5" r="2.2" fill="#A78BFA"/>
  <circle cx="8.5" cy="23.5" r="2.2" fill="#A78BFA"/>

  <!-- Central Core Intelligence Node -->
  <circle cx="16" cy="16" r="4.2" fill="#4F8CFF" stroke="#F1F5FB" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="1.8" fill="#F1F5FB"/>
</svg>
