name: Codebase Graph Intelligence Platform CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7474:7474
          - 7687:7687

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    env:
      ENVIRONMENT: test
      REDIS_URL: redis://localhost:6379
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      NEO4J_DATABASE: neo4j
      QDRANT_URL: http://localhost:6333
      QDRANT_COLLECTION: codebase_chunks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Wait for Qdrant
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:6333/readyz; then
              echo "Qdrant is ready"
              exit 0
            fi
            echo "Waiting for Qdrant..."
            sleep 2
          done
          echo "Qdrant failed to become ready"
          exit 1

      - name: Wait for Neo4j
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:7474; then
              echo "Neo4j is ready"
              exit 0
            fi
            echo "Waiting for Neo4j..."
            sleep 2
          done
          echo "Neo4j failed to become ready"
          exit 1

      - name: Seed Sample Repository
        run: uv run python scripts/ingest_repository.py --repo tests/fixtures/sample_repo

      - name: Code Quality & Linting
        run: |
          uv run ruff check app scripts tests
          uv run ruff format --check app scripts tests

      - name: Execute Pytest Suite
        run: uv run pytest -q
